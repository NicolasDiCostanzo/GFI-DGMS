<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GFI Funding Map Embed Test</title>
    <style>
        body {
            font-family: system-ui, sans-serif;
            margin: 0;
            padding: 0;
            background: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        gfi-widget {
            display: block;
            width: 960px;
            height: 500px;
            overflow: hidden;
            border: black 1px solid;
        }
    </style>
</head>

<body>
    <gfi-widget id="widget"></gfi-widget>

    <!-- Polyfill `process` before loading the UMD bundle. -->
    <script>
        window.process ??= { env: {} };
        window.process.env ??= {};
    </script>

    <!-- Load the UMD bundle so this works as a plain script tag embed. -->
    <script src="./dist/gfi-widget.umd.js"></script>
    <script>
        window.addEventListener('DOMContentLoaded', () => {
            const widget = document.getElementById('widget');
            console.log('widget tag:', widget.tagName);
            console.log('shadowRoot:', !!widget.shadowRoot);
            if (widget.shadowRoot) {
                console.log('innerHTML length:', widget.shadowRoot.innerHTML.length);
                console.log('svg exists:', !!widget.shadowRoot.querySelector('svg'));
            }
        });
    </script>
</body>

</html>
