<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GFI-DGMS — Custom Element Demo</title>
    <style>
        body {
            font-family: system-ui, sans-serif;
            margin: 0;
            padding: 24px;
            background: #f5f5f5;
        }

        h1 {
            font-size: 20px;
        }

        .widget-host {
            width: 100%;
            max-width: 900px;
            height: 600px;
            border: 1px solid #ddd;
            border-radius: 8px;
            overflow: hidden;
            background: #fff;
        }

        gfi-dgms-widget {
            display: block;
            width: 100%;
            height: 100%;
        }
    </style>
</head>

<body>
    <h1>GFI-DGMS Custom Element Demo</h1>
    <p>
        This page loads the widget as a self-contained custom element with an
        encapsulated shadow root.
    </p>

    <div class="widget-host">
        <gfi-dgms-widget></gfi-dgms-widget>
    </div>

    <script type="module" src="/src/main.ts"></script>
</body>

</html>
